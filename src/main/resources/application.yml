server:
  port: 8081
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

billing:
  scheduler-enabled: true
  poll-interval-ms: 5000
  max-attempts: 3
  retry-base-delay-seconds: 10    # demo value; production would be hours or days
  dev-endpoints: true             # demo switches; turn off outside local development

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.Metadata: WARN
    org.apache.kafka.clients.FetchSessionHandler: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN
    org.apache.kafka.clients.consumer.internals: WARN
    org.springframework.kafka.support.LoggingProducerListener: OFF